apiVersion: agent-control/v1
kind: Job
metadata:
  id: dashboard-running-state-qualification
  name: Dashboard RUNNING-state qualification
  version: 1.0.0
  description: Safely holds a governed local Job active long enough to verify honest dashboard liveness, inspection and terminal-state behaviour.
spec:
  enabled: true
  priority: normal
  concurrency: queue
  parameters:
    durationSeconds:
      type: integer
      default: 20
      minimum: 5
      maximum: 180
  steps:
    - id: observe
      name: Observe governed active execution
      action: qualification.dashboard.running-state@1.0.0
      requires: [qualification.local]
      outputs:
        - name: liveness-report
          type: application/json
          schema: agent-control.dashboard-running-state-report/v1
          version: 1.0.0
          retention: run-history
      verification: [dashboard-running-state-observed]
