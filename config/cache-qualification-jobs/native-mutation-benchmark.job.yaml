apiVersion: agent-control/v1
kind: Job
metadata:
  id: native-mutation-benchmark
  name: Native governed mutation benchmark
  version: 1.0.0
  description: Executes one frozen mutation task wholly through the Agent Control Job runtime.
spec:
  enabled: true
  priority: normal
  concurrency: queue
  parameters:
    toolInterface:
      type: string
      enum: [LEGACY_TOOL_REQUEST, SEMANTIC_TOOL_V1]
    taskId:
      type: string
      required: true
      enum: [MUT-001, MUT-002, MUT-003, MUT-004, MUT-005, MUT-006, MUT-007, MUT-008, MUT-009, MUT-010, MUT-011, MUT-012]
    profile:
      type: string
      required: true
      enum: [THIN, STANDARD, DEEP]
    prefixVariant:
      type: string
      default: stable
      enum: [stable, changed-prefix-control]
    observationTimeoutMs:
      type: integer
      minimum: 120000
      maximum: 1800000
    runtimeBudgetMode:
      type: string
      default: governed
      enum: [governed, legacy]
    absoluteJobDeadlineMs:
      type: integer
      minimum: 10000
      maximum: 28800000
    modelCallDeadlineMs:
      type: integer
      minimum: 1000
      maximum: 1800000
    toolCallDeadlineMs:
      type: integer
      minimum: 100
      maximum: 1800000
    noProgressDeadlineMs:
      type: integer
      minimum: 1000
      maximum: 1800000
  steps:
    - id: execute
      name: Native governed model loop and typed tools
      action: qualification.non-openai-cache.mutate@1.0.0
      requires: [model.execute, repository.mutation.typed, repository.verify.public]
      resources: [benchmark/native-mutation]
      outputs:
        - name: mutation-attempt
          type: application/json
          schema: agent-control.non-openai-cache-attempt/v1
          version: 1.0.0
      timeoutSeconds: 32400
    - id: verify
      name: Independent native verification
      action: qualification.non-openai-cache.verify@1.0.0
      requires: [model.execute, repository.mutation.typed, repository.verify.public]
      dependsOn: [execute]
      inputs:
        attempt: execute.mutation-attempt
      outputs:
        - name: verification-report
          type: application/json
          schema: agent-control.non-openai-cache-verification/v1
          version: 1.0.0
      verification: [non-openai-cache-mutation-verified]
      timeoutSeconds: 120
